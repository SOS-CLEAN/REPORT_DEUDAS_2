<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consulta FISE</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    margin-top: 50px;
}

input {
    padding: 10px;
    width: 250px;
    font-size: 16px;
}

button {
    padding: 10px;
    font-size: 16px;
    cursor: pointer;
}

table {
    margin: auto;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
}

#loading {
    display: none;
    margin-top: 15px;
    font-weight: bold;
}
</style>

</head>
<body>

<h2>Consulta FISE</h2>

<input type="text" id="busqueda" placeholder="Ingrese DNI o Código">
<button onclick="buscar()">Buscar</button>

<div id="loading">🔍 Buscando...</div>

<table id="resultado" style="display:none;">
    <thead>
        <tr>
            <th>DNI</th>
            <th>TIPO DE BENEFICIARIO</th>
            <th>ESTADO FISE</th>
            <th>OBSERVACIÓN</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
const TOTAL_ARCHIVOS = 50; // 🔴 AJUSTA según cuantos JSON generes

async function buscar() {
    const valor = document.getElementById("busqueda").value.trim();
    const tabla = document.getElementById("resultado");
    const tbody = tabla.querySelector("tbody");

    tbody.innerHTML = "";
    tabla.style.display = "none";

    if (!valor) return;

    document.getElementById("loading").style.display = "block";

    let encontrado = null;

    // 🔥 búsqueda secuencial optimizada
    for (let i = 1; i <= TOTAL_ARCHIVOS; i++) {
        try {
            const res = await fetch(`data_${i}.json`);
            const data = await res.json();

            encontrado = data.find(r => 
                r["DNI"] === valor || 
                r["CODIGO USUARIO"] === valor
            );

            if (encontrado) break;

        } catch (e) {
            console.warn("Error en archivo:", i);
        }
    }

    document.getElementById("loading").style.display = "none";

    if (encontrado) {
        tabla.style.display = "table";

        tbody.innerHTML = `
            <tr>
                <td>${encontrado["DNI"] || ""}</td>
                <td>${encontrado["TIPO DE BENEFICIARIO"] || ""}</td>
                <td>${encontrado["ESTADO"] || ""}</td>
                <td>${encontrado["OBSERVACIÓN"] || ""}</td>
            </tr>
        `;
    } else {
        alert("No encontrado");
    }
}
</script>

</body>
</html>
